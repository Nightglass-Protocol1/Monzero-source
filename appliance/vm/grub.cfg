# Monzero appliance boot menu. /vmlinuz and /initrd.img always point at the newest installed
# kernel (Debian keeps these links up to date), so security updates of the kernel boot by
# themselves. update-grub on the box may replace this file with its own; both work.
set timeout=2
set default=0
insmod all_video
insmod gzio
insmod ext2
search --no-floppy --file --set=root /etc/monzero-root-marker
menuentry "Monzero appliance" {
    linux /vmlinuz root=PARTLABEL=monzero-root ro quiet console=tty0 console=ttyS0,115200 apparmor=1 security=apparmor
    initrd /initrd.img
}
menuentry "Monzero appliance (previous kernel)" {
    linux /vmlinuz.old root=PARTLABEL=monzero-root ro quiet console=tty0 console=ttyS0,115200 apparmor=1 security=apparmor
    initrd /initrd.img.old
}
