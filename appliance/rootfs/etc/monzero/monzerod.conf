# Monzero appliance node. Peer-to-peer open (helps the network); full RPC on this box only
# (the wallet uses it); restricted RPC on 6177 for wallets on your own network (LAN only,
# the firewall keeps it off the internet unless you open it).
p2p-bind-ip=0.0.0.0
p2p-bind-port=6174
rpc-bind-ip=127.0.0.1
rpc-bind-port=6175
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=6177
confirm-external-bind=1
no-igd=1
out-peers=24
in-peers=48
db-sync-mode=safe:sync
add-priority-node=node.monzero.org:6174
add-priority-node=node2.monzero.org:6174
