# The faucet loads Cloudflare Turnstile (bot check): allow only its script and frame there.
# The community forum shows https images that a reader chooses to show (click to load).
map $uri $monzero_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://chainquiry.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/community/board(/|$) "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/faucet(/|$) "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: https://chainquiry.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
}

server {
    listen 80;
    listen [::]:80;
    server_name monzero.org www.monzero.org;

    root /var/www/monzero;
    index index.html index.php;
    # Keep directory redirects on the visitor's HTTPS origin behind a terminator.
    absolute_redirect off;

    # Deployment: configure set_real_ip_from for ONLY the actual TLS proxy
    # addresses, plus its real_ip_header, before enabling per-visitor limits.
    # Never trust arbitrary client-supplied forwarded headers or 0.0.0.0/0.

    location = /api/node-info {
        return 308 /api/node-info/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP directory indexes (including /api/node-info/) must execute the
    # verified website adapter, never bypass it with a direct daemon proxy.
    # Put dotfile protection before PHP regex matching, including /.hidden.php.
    location ~ \.(backup|before|bak|rollback)(-|$) {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # The explorer and opt-in miner statistics endpoint require PHP. Point
    # fastcgi_pass at the PHP-FPM listener installed on the deployment host.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/network/data/(24h|7d|30d|90d|1y|all)\.json$ {
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/news/data/(latest|index|\d{4}-\d{2}-\d{2})\.json$ {
        expires -1;
        try_files $uri =404;
    }

    location = /community/bounties/catalog.json {
        expires -1;
        try_files $uri =404;
    }

    location = /mining/benchmarks/catalog.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { text/javascript mjs; }
        expires -1; # revalidate stable module URLs; retain security headers
        try_files $uri =404;
    }

    # expires sets Cache-Control without overriding inherited security headers.
    # Serve checksum files as text whatever archive name precedes .sha256
    location ~* \.sha256$ {
        types { }
        default_type "text/plain; charset=utf-8";
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|ico|svg|zip|tar\.gz)$ {
        expires 7d;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $monzero_csp always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # This header only takes effect when the public TLS terminator preserves it.
    add_header Strict-Transport-Security "max-age=86400" always;
}
