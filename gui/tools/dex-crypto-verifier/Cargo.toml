[package]
name = "monzero-dex-crypto-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
curve25519-dalek = { package = "curve25519-dalek-ng", version = "=4.0.1" }
ecdsa_fun = { version = "=0.10.0", default-features = false, features = ["libsecp_compat", "serde", "adaptor"] }
hex = "=0.4.3"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.132"
sha2 = "=0.10.8"
sigma_fun = { version = "=0.7.0", default-features = false, features = ["ed25519", "serde", "secp256k1", "alloc"] }
zeroize = "=1.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
