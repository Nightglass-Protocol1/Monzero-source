[package]
name = "monzero-dex-evm"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "EVM side of the XMZ <-> BNB / ETH atomic swap: contract bindings, commitments, term checks"
publish = false

# Standalone until the swap machine integrates it
[workspace]

[dependencies]
alloy = { version = "1", default-features = false, features = ["sol-types", "contract", "providers", "rpc-types", "signer-local", "network", "reqwest", "reqwest-rustls-tls", "serde"] }
curve25519-dalek = "=4.1.3"
# The cross-curve proof, as in the BTC/LTC/BCH swaps (sigma_fun works on dalek-ng)
curve25519-dalek-ng = "4"
hex = "0.4"
# The Solana side (no SDK: one-signer transactions and JSON-RPC, see src/sol.rs)
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
hmac = "0.12"
# Key-exchange protocol, as the other pairs' libp2p protocols
libp2p = { version = "0.53.2", default-features = false, features = ["request-response", "json"] }
# The same key derivations as the vault helper
monzero-evm-keys = { path = "../evm-keys" }
k256 = { version = "0.13", features = ["ecdsa"] }
md-5 = "0.10"
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
secp256kfun = { version = "0.10", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sigma_fun = { version = "0.7", default-features = false, features = ["ed25519", "secp256k1", "alloc", "serde"] }
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }
# Sealed mailbox messages between the two traders of an offer (carried by relays)
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
# The app talks to the open relays (same reqwest as alloy)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# The helper binary's runtime (alloy already uses tokio)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Android only: the stand-alone helper checks TLS servers against built-in roots (see chain.rs http_client)
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
futures = "0.3"
libp2p = { version = "0.53.2", default-features = false, features = ["request-response", "json", "tokio", "tcp", "noise", "yamux"] }
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
