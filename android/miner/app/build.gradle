plugins {
    id 'com.android.application'
}

android {
    namespace 'org.monzero.miner'
    compileSdk 35

    defaultConfig {
        applicationId "org.monzero.miner"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            // XMRig is shipped prebuilt for these ABIs (see xmrig/build-android.sh)
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // The miner binary is executed from nativeLibraryDir, so it must be extracted on install.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
